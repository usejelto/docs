# Portable workflow: this component directory must be the repository root.
name: docs checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  GOFLAGS: -mod=readonly

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Asking the registry whether this version is still publishable.
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability check
        run: npm audit --audit-level=moderate --package-lock-only
      - name: Vendored snapshots match their manifests
        run: node vendor-check.mjs
      - name: Public page, metadata, link and boundary checks
        run: npm run check:content
      - name: Build browser assets
        run: npm run build
      - name: Browser and type checks
        run: npm test && npm run check
      - name: Serving, search and content boundaries
        # Assets are built first: the Go tests assert the rendered output.
        run: go test ./... -count=1
      - name: Go dependency vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oras-project/setup-oras@v2
        with:
          version: '1.3.3'
      - name: Sign in to the organization registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The package version is still publishable
        # A published version is immutable. Changed content under a version the
        # registry already holds would fail the publish job after every check
        # had passed; this asks first and names the fix.
        env:
          PRODUCER_COMMIT: ${{ github.sha }}
        run: python3 vendor/package-tools/package_component.py --commit "$PRODUCER_COMMIT" --out "$RUNNER_TEMP/package-check" check
      - uses: actions/upload-artifact@v7
        with:
          name: docs-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish package
    # Backend CI contract §8: the producer publishes its own package after this
    # push's checks pass on main. The pair is built from the artifact the checks
    # uploaded, so what was tested is what ships.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Build provenance for the pushed digest (public repository).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: docs-assets
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oras-project/setup-oras@v2
        with:
          version: '1.3.3'
      - name: Sign in to the organization registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the component package
        id: package
        # component-package.json names what the archive holds; the version comes
        # from package.json. An existing version is reused only when it is
        # byte-identical; a collision fails, so changed content needs a new version.
        env:
          PRODUCER_COMMIT: ${{ github.sha }}
        run: python3 vendor/package-tools/package_component.py --commit "$PRODUCER_COMMIT" --out "$RUNNER_TEMP/package" publish
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.package.outputs.name }}
          subject-digest: ${{ steps.package.outputs.digest }}
          push-to-registry: true
          # The attestation is what the backend verifies; the org has no
          # artifact-metadata storage, so the optional record is not attempted.
          create-storage-record: false
